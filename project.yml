name: Remindy
options:
  bundleIdPrefix: personal.remindy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: G2442WAF29
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.francescooddo.Remindy
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "8"
targets:
  Remindy:
    type: application
    platform: iOS
    sources:
      - path: Remindy
    entitlements:
      path: Remindy/Remindy.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG
    info:
      path: Remindy/Info.plist
      properties:
        CFBundleDisplayName: Remindy
        CFBundleVersion: "8"
        UILaunchScreen: {}
        NFCReaderUsageDescription: Remindy reads and writes NFC tags to link them with your tasks.
        NSLocationWhenInUseUsageDescription: Remindy uses your location to pick places and show where you are on the map.
        NSLocationAlwaysAndWhenInUseUsageDescription: Remindy monitors your chosen places so it can alert you when you arrive or leave, even when the app is closed.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: personal.remindy.tag
            CFBundleURLSchemes:
              - remindy
